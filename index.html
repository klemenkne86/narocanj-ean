<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAW naročanje – EAN + količina</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#18222c}
header{background:#2f4f6c;color:#fff;padding:14px 16px;position:sticky;top:0}
main{max-width:720px;margin:auto;padding:14px 14px 110px}
.card{background:#fff;border:1px solid #d8e0e6;border-radius:12px;padding:14px;margin-bottom:12px}
.scanBtn,.addBtn,.footer button{border:0;border-radius:10px;padding:14px;font-weight:800;font-size:16px;cursor:pointer}
.scanBtn{width:100%;background:#c92833;color:#fff;margin-bottom:12px}
.addBtn{width:100%;background:#2f4f6c;color:#fff;margin-top:10px}
.form{display:grid;grid-template-columns:1fr 110px;gap:10px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #aeb9c3;border-radius:8px;font-size:17px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4}
.ean{font-weight:800}
.qty{display:flex;align-items:center;border:1px solid #c9d2d9;border-radius:7px;overflow:hidden}
.qty button{width:30px;height:30px;border:0;background:#edf1f4}
.qty b{min-width:36px;text-align:center}
.del{border:0;width:34px;height:32px;border-radius:7px;background:#f8dfe2;color:#a31e28;font-weight:800}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d8e0e6;display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:10px 14px}
.clear{background:#f4dfe1;color:#9e2028}.export{background:#2e7d32;color:#fff}
#scannerModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;padding:14px;align-items:center;justify-content:center}
.scannerBox{width:min(560px,100%);background:#fff;border-radius:14px;overflow:hidden}
.scannerHead{background:#2f4f6c;color:#fff;padding:12px 14px;font-weight:800;display:flex;justify-content:space-between}
.scannerBody{padding:12px}
.closeBtn{border:0;background:#fff;border-radius:6px;padding:7px 10px;font-weight:700}
#reader{width:100%}
.scanInfo,#errorBox{margin-top:8px;padding:9px;border-radius:8px;font-size:13px;line-height:1.4}
.scanInfo{background:#eef5fa;border:1px solid #c9dce9}
#errorBox{display:none;background:#fde8e8;border:1px solid #e6baba;color:#8b2020}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2c37;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;display:none;z-index:200}
@media(max-width:520px){.form{grid-template-columns:1fr 95px}}
</style>
</head>
<body>
<header><strong>FAW NAROČANJE</strong><div>EAN + količina</div></header>
<main>
<section class="card"><h2>Hitro naročanje</h2><p>Skeniraj EAN, vnesi količino in izvozi Excel za FAW.</p></section>
<button class="scanBtn" onclick="openScanner()">📷 SKENIRAJ EAN</button>
<section class="card">
<div class="form">
<div><label>EAN KODA *</label><input id="ean" inputmode="numeric" placeholder="3831234567890"></div>
<div><label>KOLIČINA *</label><input id="qty" type="number" min="1" value="1"></div>
</div>
<button class="addBtn" onclick="addItem()">DODAJ NA SEZNAM</button>
</section>
<section class="card"><h2>Postavke</h2><div id="list"></div><div id="summary"></div></section>
</main>
<div class="footer"><button class="clear" onclick="clearOrder()">POČISTI</button><button class="export" onclick="exportXlsx()">IZVOZI EXCEL ZA FAW</button></div>

<div id="scannerModal">
<div class="scannerBox">
<div class="scannerHead"><span>Skeniranje EAN</span><button class="closeBtn" onclick="closeScanner()">Zapri</button></div>
<div class="scannerBody">
<div id="reader"></div>
<div class="scanInfo">Usmeri zadnjo kamero v črtno kodo. Drži telefon približno 15–30 cm od kode.</div>
<div id="errorBox"></div>
</div>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
let items=JSON.parse(localStorage.getItem('faw_simple_order')||'[]');
let scanner=null,scanning=false;
function save(){localStorage.setItem('faw_simple_order',JSON.stringify(items))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}
function validEAN(e){return /^[0-9]{8,14}$/.test(e)}
function addItem(){
 const e=document.getElementById('ean').value.trim();
 const q=parseInt(document.getElementById('qty').value,10);
 if(!validEAN(e)){toast('EAN mora imeti 8–14 številk.');return}
 if(!Number.isInteger(q)||q<1){toast('Količina mora biti najmanj 1.');return}
 const ex=items.find(x=>x.ean===e); if(ex) ex.qty+=q; else items.push({ean:e,qty:q});
 save();render();document.getElementById('ean').value='';document.getElementById('qty').value='1';document.getElementById('ean').focus()
}
function render(){
 const l=document.getElementById('list');
 l.innerHTML=items.length?items.map((x,i)=>`<div class="item"><div><div class="ean">${x.ean}</div><small>EAN</small></div><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${x.qty}</b><button onclick="chg(${i},1)">+</button></div><button class="del" onclick="del(${i})">×</button></div>`).join(''):'Seznam je prazen.';
 document.getElementById('summary').textContent=`Različnih EAN: ${items.length} | Skupaj kos: ${items.reduce((s,x)=>s+x.qty,0)}`
}
function chg(i,d){items[i].qty=Math.max(1,items[i].qty+d);save();render()}
function del(i){items.splice(i,1);save();render()}
function clearOrder(){if(confirm('Izbrišem celotno naročilo?')){items=[];save();render()}}
function exportXlsx(){
 if(!items.length){toast('Seznam je prazen.');return}
 if(typeof XLSX==='undefined'){alert('Excel knjižnica se ni naložila.');return}
 const rows=[['EAN','Količina'],...items.map(x=>[String(x.ean),Number(x.qty)])];
 const ws=XLSX.utils.aoa_to_sheet(rows);
 for(let r=1;r<rows.length;r++){
   const a=ws[XLSX.utils.encode_cell({r:r,c:0})]; if(a){a.t='s';a.z='@'}
   const b=ws[XLSX.utils.encode_cell({r:r,c:1})]; if(b){b.t='n';b.z='0'}
 }
 ws['!cols']=[{wch:20},{wch:12}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Narocilo');
 XLSX.writeFile(wb,'narocilo_FAW.xlsx',{bookType:'xlsx'});
}
async function openScanner(){
 const modal=document.getElementById('scannerModal'),err=document.getElementById('errorBox');
 err.style.display='none';err.textContent='';modal.style.display='flex';
 try{
  if(!window.isSecureContext) throw new Error('Stran mora biti odprta prek HTTPS.');
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('Brskalnik ne omogoča dostopa do kamere.');
  scanner=new Html5Qrcode('reader');
  const cams=await Html5Qrcode.getCameras();
  if(!cams.length) throw new Error('Telefon ni vrnil nobene kamere.');
  let id=cams[0].id;
  const back=cams.find(c=>/back|rear|environment|zadnja|zadaj/i.test(c.label||'')); if(back) id=back.id;
  await scanner.start(id,{
    fps:10,
    qrbox:(w,h)=>({width:Math.floor(w*.86),height:Math.floor(Math.min(170,h*.34))}),
    aspectRatio:1.777778,
    disableFlip:true,
    formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128]
  },txt=>{
    const code=(txt||'').replace(/\D/g,'');
    if(validEAN(code)){
      document.getElementById('ean').value=code;
      closeScanner();
      setTimeout(()=>{document.getElementById('qty').focus();document.getElementById('qty').select()},200);
      toast('EAN skeniran. Vnesi količino.');
    }
  },()=>{});
  scanning=true;
 }catch(e){
  err.style.display='block';
  err.innerHTML='<strong>Kamera se ni odprla.</strong><br>'+String(e.message||e)+'<br><br>Preveri dovoljenje za kamero in da stran odpiraš direktno v Chromu prek HTTPS.';
 }
}
async function closeScanner(){
 if(scanner){try{if(scanning)await scanner.stop();await scanner.clear()}catch(e){}}
 scanner=null;scanning=false;document.getElementById('scannerModal').style.display='none';document.getElementById('reader').innerHTML=''
}
document.getElementById('ean').addEventListener('keydown',e=>{if(e.key==='Enter'){document.getElementById('qty').focus();document.getElementById('qty').select()}});
document.getElementById('qty').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
render();
</script>
</body>
</html>
